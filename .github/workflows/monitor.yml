name: Monitor WHM Visa Country Caps

on:
  schedule:
    - cron: '23 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: write

jobs:
  check-caps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Scraper
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIPTIONS: ${{ secrets.SUBSCRIPTIONS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: node scraper.js

      - name: Commit and Push Updated Status JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update status.json state" && git push)
